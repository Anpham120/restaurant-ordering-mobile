spring.application.name=ordering-system
server.port=${PORT:8080}

# ---- Default (dev) profile: H2 in-memory, schema from Hibernate, demo data ----
spring.datasource.url=jdbc:h2:mem:restaurant_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# load lazy collections (option groups, options, order items…) in batches instead of one query per row (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.web.locale=vi
spring.web.locale-resolver=fixed
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT: the default secret is for local development only; prod requires APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.ttl-hours=12

# Comma-separated list of allowed browser origins for /api/**
app.cors.allowed-origins=${APP_CORS_ORIGINS:*}

# Seed the sample menu, delivery zones and vouchers on an empty DB (+ demo accounts when no admin is configured).
app.seed.demo=true
# First MANAGER account, created when no manager exists yet (used in prod). Login = phone number.
app.admin.phone=${APP_ADMIN_PHONE:0900000000}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Online payment: VietQR bank transfer confirmed by SePay webhooks (POST /api/payments/sepay/webhook)
app.sepay.api-key=${SEPAY_API_KEY:}
app.payment.code-prefix=${APP_PAYMENT_CODE_PREFIX:ATL}
app.payment.expiry-check-ms=60000
# Public address of the web app (return link after paying in a banking app)
app.public-url=${APP_PUBLIC_URL:http://localhost:8082}

# E-mail (forgot-password codes). Gmail: SMTP_USERNAME = the address, SMTP_PASSWORD = an App Password.
# Without SMTP_USERNAME mails are only logged (development).
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${MAIL_FROM:}
app.mail.from-name=Atlas Restaurant

# Promotions: quiet hours for announcements and per-customer frequency cap
app.promotions.quiet-start=21:00
app.promotions.quiet-end=08:00
app.promotions.cap-hours=24
