spring.application.name=ordering-system
server.port=${PORT:8080}

# ---- Default (dev) profile: H2 in-memory, schema from Hibernate, demo data ----
spring.datasource.url=jdbc:h2:mem:restaurant_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT: the default secret is for local development only; prod requires APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.ttl-hours=12

# Comma-separated list of allowed browser origins for /api/**
app.cors.allowed-origins=${APP_CORS_ORIGINS:*}

# Seed menu, tables, demo accounts (manager/staff/kitchen) and a voucher on an empty DB.
app.seed.demo=true
# Create a first MANAGER account on an empty users table (used in prod).
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
