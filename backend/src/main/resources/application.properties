spring.application.name=ordering-system
server.port=8080

# H2 In-Memory Database Configuration (for quick development)
spring.datasource.url=jdbc:h2:mem:restaurant_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (override app.jwt.secret with env var APP_JWT_SECRET in production)
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-please-0123456789}
app.jwt.ttl-hours=12
