# ---- Production profile (SPRING_PROFILES_ACTIVE=prod) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

spring.h2.console.enabled=false

# No default: the app refuses to start without a strong secret.
app.jwt.secret=${APP_JWT_SECRET}
app.cors.allowed-origins=${APP_CORS_ORIGINS}
app.seed.demo=${APP_SEED_DEMO:false}
# never write password reset codes to the log, even when SMTP is missing
app.mail.log-content=false

# Behind the nginx reverse proxy (X-Forwarded-* headers)
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
