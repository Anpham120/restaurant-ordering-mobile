# Host nginx vhost (/etc/nginx/sites-available/order.atlasplatform12.tech.conf).
# Install: see DEPLOY.md. certbot --nginx adds the 443/TLS block and the HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name order.atlasplatform12.tech;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # REST API -> backend container
    location /api/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # never expose the dev DB console
    location /h2-console {
        return 404;
    }

    # Web app -> web container
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
